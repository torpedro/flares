# Copy to server.yaml. Run: flare config check --config server.yaml
server:
  listen: 127.0.0.1:8000
  api_token: replace-with-a-long-random-shared-token
  # api_token: {env: FLARE_API_TOKEN}
  # api_token: {file: /run/secrets/flare-api-token}

storage:
  database: flare.sqlite3  # relative to this configuration file
  retention:
    deliveries: null       # keep completed delivery history indefinitely
    idempotency_keys: null # keys pin delivery records until they expire
    # deliveries: 30d
    # idempotency_keys: 90d

delivery:
  retry:
    max_attempts: 1        # includes the initial attempt; use 3 to enable retries
    base_delay: 10s
    max_delay: 1h
  rate_limit:
    attempts: 120         # destination attempts across the entire service; 0 disables
    window: 1m
  group_window: 30s       # used only for alerts with a group_key; 0s disables
  queue_limit: 10000      # queued and running deliveries; 0 disables the limit

destinations: {}
# destinations:
#   phone:
#     type: pushover
#     app_token: {env: PUSHOVER_APP_TOKEN}
#     user_key: {file: /run/secrets/pushover-user-key}
#     device: phone
#   audit:
#     type: webhook
#     url: https://hooks.example.com/flare
#     bearer_token: {env: WEBHOOK_TOKEN}
#     delivery:
#       retry:
#         max_attempts: 3
#       rate_limit:        # additional destination limit; global limit still applies
#         attempts: 20
#         window: 1m

routing:
  default: []             # explicitly disabled until destinations are configured
  severity: {}
  # default: [audit]
  # severity:
  #   critical: [audit, phone]
  #   info: []            # explicitly suppress info notifications
