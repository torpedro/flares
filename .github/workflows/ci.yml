name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.9'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --examples --locked && cargo build --bin flares --locked
      - name: Sync Python environment
        run: uv sync --project clients/python --locked
      - name: Check cross-language versions
        run: uv run --project clients/python python scripts/check_versions.py
      - name: Lint Python
        run: uv run --project clients/python ruff check --config clients/python/pyproject.toml clients/python tests/contract scripts
      - name: Check Python formatting
        run: uv run --project clients/python ruff format --check --config clients/python/pyproject.toml clients/python tests/contract scripts
      - name: Lint Bash client
        run: shellcheck clients/bash/flares.sh clients/bash/tests/source.sh
      - name: Test Bash client
        run: bash clients/bash/tests/source.sh
      - name: Run Python tests
        run: uv run --project clients/python pytest -q
      - name: Build release artifacts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: uv run --project clients/python python scripts/build_artifacts.py
      - name: Checksum release artifacts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: flares-linux-x86_64-and-clients
          path: dist/*
          if-no-files-found: error
