name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.9'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --examples --locked && cargo build --bin flares --locked
      - run: uv sync --project clients/python --locked
      - run: uv run --project clients/python python scripts/check_versions.py
      - run: uv run --project clients/python ruff check --config clients/python/pyproject.toml clients/python tests/contract scripts
      - run: uv run --project clients/python ruff format --check --config clients/python/pyproject.toml clients/python tests/contract scripts
      - run: shellcheck clients/bash/flares.sh clients/bash/tests/source.sh
      - run: bash clients/bash/tests/source.sh
      - run: uv run --project clients/python pytest -q
      - run: uv run --project clients/python python scripts/build_artifacts.py
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: flares-linux-x86_64-and-clients
          path: dist/*
          if-no-files-found: error
