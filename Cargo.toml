[workspace]
members = ["crates/flare-types", "clients/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "flare"
version.workspace = true
edition.workspace = true
description = "HTTP issue tracking with Pushover notifications"
license = "MIT"
readme = "README.md"

[dependencies]
flare-types = { path = "crates/flare-types", version = "0.1.0", features = ["openapi", "cli"] }
flare-client = { path = "clients/rust", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = { version = "5", features = ["chrono"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
