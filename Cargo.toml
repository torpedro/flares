[workspace]
members = ["crates/flares-types", "clients/rust"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/torpedro/flares"

# Single source for the published versions of the workspace's own crates.
# scripts/set_version.py rewrites these together with [workspace.package].version.
[workspace.dependencies]
flares-types = { path = "crates/flares-types", version = "0.1.4" }
flares-client = { path = "clients/rust", version = "0.1.4" }

[package]
name = "flares"
repository.workspace = true
version.workspace = true
edition.workspace = true
description = "HTTP issue tracking with Pushover notifications"
license = "MIT"
readme = "README.md"

[dependencies]
flares-types = { workspace = true, features = ["openapi", "cli"] }
flares-client = { workspace = true }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Counts and rate windows use checked u64 conversions at the SQLite boundary.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = { version = "5", features = ["chrono"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
